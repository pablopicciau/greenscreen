[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "greenframe"
version = "0.2.0"
description = "Green Frame Replacer: sostituisce un pannello verde tenuto in mano con un'immagine, in un video"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-contrib-python>=4.8",
    "torch>=2.4",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pillow>=10"]

[project.scripts]
greenframe = "greenframe.cli:main"

[tool.setuptools]
packages = ["greenframe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
